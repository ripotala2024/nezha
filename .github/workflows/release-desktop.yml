name: Release Desktop Builds

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      platforms:
        description: "要构建的平台（逗号分隔，留空=全部）。可选值：windows-x86_64, windows-arm64, macos-x86_64, macos-arm64, linux-x86_64"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-version:
    name: Verify version consistency
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag matches package.json / Cargo.toml / tauri.conf.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(jq -r .version package.json)
          TAURI=$(jq -r .version src-tauri/tauri.conf.json)
          CARGO=$(awk -F\" '/^version[[:space:]]*=/ {print $2; exit}' src-tauri/Cargo.toml)
          echo "tag=$TAG package.json=$PKG tauri.conf.json=$TAURI Cargo.toml=$CARGO"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$TAURI" ] || [ "$TAG" != "$CARGO" ]; then
            echo "::error::Version mismatch — tag '$TAG' must equal package.json ($PKG), tauri.conf.json ($TAURI), and Cargo.toml ($CARGO)"
            exit 1
          fi

  setup-matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve matrix from inputs
        id: resolve
        env:
          PLATFORMS_INPUT: ${{ github.event.inputs.platforms }}
        run: |
          set -euo pipefail
          ALL='[
            {"name":"Windows x86_64","artifact_name":"windows-x86_64","runner":"windows-latest","target":"x86_64-pc-windows-msvc","bundle_args":"--bundles nsis,msi"},
            {"name":"Windows ARM64","artifact_name":"windows-arm64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","bundle_args":"--bundles nsis,msi"},
            {"name":"macOS x86_64","artifact_name":"macos-x86_64","runner":"macos-15-intel","target":"x86_64-apple-darwin","bundle_args":"--bundles dmg"},
            {"name":"macOS ARM64","artifact_name":"macos-arm64","runner":"macos-15","target":"aarch64-apple-darwin","bundle_args":"--bundles dmg"},
            {"name":"Linux x86_64","artifact_name":"linux-x86_64","runner":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundle_args":"--bundles deb,rpm"}
          ]'
          INPUT="${PLATFORMS_INPUT:-}"
          if [ -z "$INPUT" ]; then
            MATRIX=$(echo "$ALL" | jq -c '{include: .}')
          else
            FILTER=$(echo "$INPUT" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
            MATRIX=$(echo "$ALL" | jq -c --argjson sel "$FILTER" '{include: map(select(.artifact_name as $a | $sel | index($a)))}')
            COUNT=$(echo "$MATRIX" | jq '.include | length')
            if [ "$COUNT" = "0" ]; then
              echo "::error::没有匹配到任何平台。输入='$INPUT'，可选值见 workflow_dispatch.inputs.platforms 描述。"
              exit 1
            fi
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: $MATRIX"

  build:
    name: Build ${{ matrix.name }}
    needs: [verify-version, setup-matrix]
    if: |
      always() &&
      needs.setup-matrix.result == 'success' &&
      (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build ${{ matrix.name }}
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundle_args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/**/*
          token: ${{ secrets.GITHUB_TOKEN }}
